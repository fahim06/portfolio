# Dependabot version updates — automatically opens PRs to keep dependencies current.
# Config options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # Keep package.json / package-lock.json deps up to date
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      # Match the repo's conventional-commit style (chore(deps) / chore(deps-dev))
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Major bumps that currently break the build — adopt deliberately, not via auto-PR.
      # (Minor/patch updates for these still get proposed.)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
