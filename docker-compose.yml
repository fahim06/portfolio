services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-dev
    container_name: portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - DEV_OPEN=false
    stdin_open: true
    tty: true
    restart: unless-stopped
